on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please/release-please-config.json
          manifest-file: .release-please/.release-please-manifest.json

  package-mod:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
        - uses: actions/checkout@v4
        
        - name: create-zip
          run: |
            # not used rn
            # (shell option) set null glob, so that src/* doesn't error if src is empty
            # shopt -s nullglob

            MOD_NAME=$(yq '.id' gdpatch_mod.toml)
            MOD_NAME_VER="$MOD_NAME-${{ needs.release-please.outputs.tag_name }}"

            mkdir "$MOD_NAME_VER"
            mv gdpatch_mod.toml patcher.lua "$MOD_NAME_VER"
            zip -r "$MOD_NAME_VER.zip" "$MOD_NAME_VER"

            echo "MOD_NAME_VER=$MOD_NAME_VER" >> $GITHUB_ENV
          
        - uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.release-please.outputs.tag_name }}
            files: ${{ env.MOD_NAME_VER }}.zip
